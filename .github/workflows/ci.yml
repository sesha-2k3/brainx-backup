# ============================================================================
# BrainX CI/CD Pipeline
# ============================================================================
#
# Stages:
#   1. lint      → ruff check + ruff format --check (fast fail)
#   2. typecheck → mypy on src/ (catches type errors early)
#   3. test      → pytest with coverage against in-memory SQLite
#   4. deploy    → placeholder (runs only on main after all checks pass)
#
# Design decisions:
#   - Separate jobs so lint failures don't waste test runner time
#   - PostgreSQL NOT needed: tests use async SQLite (fake DB)
#   - No real Groq API calls: tests stub the foreign system boundary
#   - All dev deps from pyproject.toml [project.optional-dependencies.dev]
#   - Coverage threshold enforced (fail_under in pyproject.toml)
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Lint & Format Check
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Check linting rules
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Type Checking
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install project with dev deps
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary || true
        # NOTE: Start non-blocking (|| true). Remove when types are clean.

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: Test with Coverage
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      # Dummy env vars so pydantic Settings loads during import
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      GROQ_API_KEY: "test-fake-key"
      APP_ENV: "testing"
      TENANT_ID: "test-tenant"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install project with dev deps
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit-results.xml \
            -v

      # ── Reporting: visible directly in the Actions UI and PR checks ──

      - name: Test results summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit-results.xml
          comment_mode: off
          check_name: Test Results

      - name: Coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 50

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit-results.xml

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 4: Deploy Gate (only on main, after all checks pass)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "All checks passed. Ready to deploy."
          # TODO: Add your deployment steps here, e.g.:
          #   docker build -t brainx:${{ github.sha }} .
          #   docker push your-registry/brainx:${{ github.sha }}
