[project]
name = "brainx"
version = "0.1.0"
description = "AI-powered Personal CRM"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    # Data validation
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # HTTP client
    "httpx>=0.26.0",
    # AI/ML
    "groq>=0.4.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    # Utilities
    "python-dateutil>=2.8.2",
    "phonenumbers>=8.13.0",
    "tenacity>=8.2.0",
    # Background tasks
    "apscheduler>=3.10.4",
    "pre-commit>=4.5.1",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    # Async SQLite for test fake DB (no Postgres needed in CI)
    "aiosqlite>=0.20.0",
    # Type checking
    "mypy>=1.13.0",
]

prod = [
    "gunicorn>=21.0.0",
    "sentry-sdk[fastapi]>=1.0",
]

# Pytest 
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: async test functions",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]

# Coverage tools
[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/config.py",
]

[tool.coverage.report]
show_missing = true
# Start at 50%, ratchet up as you add tests:
#   50% → first pass (current)
#   60% → after adding query_parser + transcription tests
#   70% → after adding OCR + full API input processing tests
#   80% → target for mature project
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ ==",
    "pass",
    "\\.\\.\\.",
]

# Ruff linter configs
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "RUF012", # mutable class variables (SQLAlchemy models)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
